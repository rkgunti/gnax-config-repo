spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # One block per service. Public path: /gnax/<original path>; "/gnax" is stripped before forwarding.
            - id: identity-service
              uri: http://gnax-identity-service.dev.svc.cluster.local:8080
              predicates:
                - Path=/gnax/api/v1/auth/**
              filters:
                - StripPrefix=1

gnax:
  jwt:
    issuer: gnax-identity-service
    public-key: '{cipher}'
