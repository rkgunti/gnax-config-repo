server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:30432/devdb
    username: devuser
    password: AppPassword123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true

jwt:
  issuer: gnax-identity-service
  access-token-expiration: 900
  refresh-token-expiration: 604800
